name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate project directory
        id: locate
        run: |
          if [ -f "./package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./Omar/package.json" ]; then
            echo "dir=./Omar" >> "$GITHUB_OUTPUT"
          else
            PKG_DIR=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs -r dirname)
            echo "dir=${PKG_DIR:-.}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Build project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.dir }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
